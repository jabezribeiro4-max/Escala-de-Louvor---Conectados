<title>Escala de Louvor: Conectados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky header, card agenda, bottom tab bar, bottom sheets for every form.
   Two looks chosen by each person (data-app on <html>): escuro "Neon" (preto com azul elétrico, padrão)
   e claro (branco com azul profundo). O microfone dourado do líder fica igual nos dois. */
:root{
  --bg:#04060C; --surface:#0B1120; --surface-2:#111A2E; --ink:#EAF1FF; --muted:#94A3BF; --line:#1B2740; --line-hi:rgba(150,190,255,.08);
  --accent:#5B9BFF; --accent-ink:#FFFFFF; --accent-soft:#0F1E3D; --gold:#7DB2FF; --gold-soft:#0F2147;
  --gold-grad:linear-gradient(135deg,#F7D98A 0%,#E9B949 45%,#B9862C 100%);
  --blue-grad:linear-gradient(160deg,#4F8DFF 0%,#2563EB 50%,#1E3A8A 100%);
  --brand-grad:linear-gradient(135deg,#3B82F6 0%,#2357E8 50%,#1A3BA8 100%); --brand-text:linear-gradient(120deg,#BFD8FF 0%,#6FA6FF 45%,#3D7BFF 100%); --brand-rgb:59,130,246;
  --today-grad:linear-gradient(160deg,#EAF2FF 0%,#B5CEFF 100%); --today-ink:#0A1633;
  --hero-bg:linear-gradient(135deg,#071233 0%,#0E2A8A 45%,#1D4ED8 75%,#0A1A55 100%); --hero-ink:#FFFFFF;
  --hero-blob1:radial-gradient(circle,rgba(56,189,248,.85),transparent 66%); --hero-blob2:radial-gradient(circle,rgba(59,91,255,.95),transparent 66%);
  --tile:radial-gradient(circle at 50% 35%,#16223A,#0A101D); --tile-gold:radial-gradient(circle at 50% 35%,#1A2C55,#0A1430);
  --glow:rgba(37,99,235,.34); --glow2:rgba(14,165,233,.16); --veil:rgba(1,4,12,.7);
  --streak:linear-gradient(118deg,transparent 38%,rgba(59,130,246,.10) 46%,rgba(125,211,252,.06) 50%,transparent 58%);
  --ok:#7FD8A8; --ok-soft:rgba(80,200,140,.14); --wa:#4BE08A;
  --danger:#FF7272; --danger-soft:#361A18;
  --r-lider:#F3CB62; --r-backing:#D8D0BF; --r-bateria:#FF8A6E; --r-baixo:#5ADBB0; --r-guitarra:#86B8FF; --r-violao:#E2A877; --r-teclado:#BDA4FF; --yt:#FF5C5C;
  --shadow:0 1px 0 var(--line-hi) inset,0 12px 30px -16px rgba(0,0,0,.8);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-app="light"]{
  --bg:#F7F9FC; --surface:#FFFFFF; --surface-2:#F1F4F9; --ink:#0F172A; --muted:#5B6478; --line:#E3E8F0; --line-hi:rgba(255,255,255,.9);
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E7EEFE; --gold:#1D4ED8; --gold-soft:#E7EEFE;
  --brand-grad:linear-gradient(135deg,#3B82F6 0%,#1D4ED8 55%,#1E3A8A 100%); --brand-text:linear-gradient(135deg,#2563EB 0%,#1E3A8A 100%); --brand-rgb:37,99,235;
  --blue-grad:linear-gradient(160deg,#60A5FA 0%,#2563EB 55%,#1E40AF 100%); --today-grad:linear-gradient(160deg,#1E293B 0%,#0F172A 100%); --today-ink:#FFFFFF;
  --hero-bg:linear-gradient(135deg,#2563EB 0%,#1D4ED8 45%,#1E3A8A 100%); --hero-ink:#FFFFFF;
  --hero-blob1:radial-gradient(circle,rgba(125,211,252,.95),transparent 68%); --hero-blob2:radial-gradient(circle,rgba(129,140,248,.9),transparent 68%);
  --tile:radial-gradient(circle at 50% 35%,#FFFFFF,#EEF2F8); --tile-gold:radial-gradient(circle at 50% 35%,#F0F5FF,#D5E2FF);
  --glow:rgba(37,99,235,.12); --glow2:rgba(56,189,248,.08); --streak:none; --veil:rgba(15,23,42,.40);
  --ok:#15803D; --ok-soft:rgba(21,128,61,.10); --wa:#15934A;
  --danger:#DC2626; --danger-soft:#FDECEC; --yt:#D21F1F;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 30px -16px rgba(15,23,42,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: light){:root[data-app="auto"]{
  --bg:#F7F9FC; --surface:#FFFFFF; --surface-2:#F1F4F9; --ink:#0F172A; --muted:#5B6478; --line:#E3E8F0; --line-hi:rgba(255,255,255,.9);
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E7EEFE; --gold:#1D4ED8; --gold-soft:#E7EEFE;
  --brand-grad:linear-gradient(135deg,#3B82F6 0%,#1D4ED8 55%,#1E3A8A 100%); --brand-text:linear-gradient(135deg,#2563EB 0%,#1E3A8A 100%); --brand-rgb:37,99,235;
  --blue-grad:linear-gradient(160deg,#60A5FA 0%,#2563EB 55%,#1E40AF 100%); --today-grad:linear-gradient(160deg,#1E293B 0%,#0F172A 100%); --today-ink:#FFFFFF;
  --hero-bg:linear-gradient(135deg,#2563EB 0%,#1D4ED8 45%,#1E3A8A 100%); --hero-ink:#FFFFFF;
  --hero-blob1:radial-gradient(circle,rgba(125,211,252,.95),transparent 68%); --hero-blob2:radial-gradient(circle,rgba(129,140,248,.9),transparent 68%);
  --tile:radial-gradient(circle at 50% 35%,#FFFFFF,#EEF2F8); --tile-gold:radial-gradient(circle at 50% 35%,#F0F5FF,#D5E2FF);
  --glow:rgba(37,99,235,.12); --glow2:rgba(56,189,248,.08); --streak:none; --veil:rgba(15,23,42,.40);
  --ok:#15803D; --ok-soft:rgba(21,128,61,.10); --wa:#15934A;
  --danger:#DC2626; --danger-soft:#FDECEC; --yt:#D21F1F;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 30px -16px rgba(15,23,42,.22);
  color-scheme:light;
}}
.theme-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center}
.theme-btn svg{width:19px;height:19px}
.seg.theme{margin:14px 0 0}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--streak) fixed,radial-gradient(120% 50% at 85% -12%,var(--glow),transparent 62%) fixed,radial-gradient(90% 45% at -15% 18%,var(--glow2),transparent 60%) fixed,var(--bg);transition:background-color .25s;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
.credit{text-align:center;font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:28px 0 0;opacity:.8}
.credit b{color:var(--accent);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-bottom:110px;min-height:100%}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:11px}
.logo{flex:none;color:var(--accent-ink);width:42px;height:42px;border-radius:13px;background:var(--brand-grad);display:grid;place-items:center;box-shadow:0 8px 22px -8px rgba(var(--brand-rgb),.7),0 0 0 1px rgba(255,236,190,.25) inset}
.logo svg{width:26px;height:26px}
.wm{min-width:0}
.wm small{display:block;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.wm h1{margin:1px 0 0;font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1;white-space:nowrap;background:var(--brand-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 2px 14px}
.pagehead h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.pagehead span{font-size:13.5px;color:var(--muted)}
.datebox{display:flex;flex-direction:column;gap:10px}
.bigin{max-width:190px;font-family:var(--f-display);font-size:22px;font-weight:700;text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.datebox .chip{padding:9px 13px;font-size:14.5px;font-variant-numeric:tabular-nums}
.me-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 4px;font-size:13px;font-weight:600;max-width:52%}
.me-btn>span:nth-child(2){padding-right:4px}
.verified{flex:none;font-size:12px;font-weight:800;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 8px}
.claims{border-color:rgba(var(--brand-rgb),.45)}
.claim{display:flex;flex-direction:column;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.claim:first-of-type{border-top:0}
.claim-txt{font-size:15px}
.claim-txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.claim-btns{display:flex;gap:8px}
.claim-btns .btn{flex:1;padding:10px}
.adm{flex:none;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--accent-ink);background:var(--brand-grad);border-radius:999px;padding:3px 7px}
.me-btn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--c,#777)}
.av.lg{width:42px;height:42px;font-size:15px}
.av.empty{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}

.demo{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:8px 12px;margin-bottom:12px}
.demo b{color:var(--ink)}

/* Hero: next service, drawn on a music staff */
/* Cartão "Seu próximo culto": gradiente vivo com luzes que flutuam devagar + contador em vidro */
.hero{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;
  border:0;border-radius:28px;padding:20px 18px 18px 20px;margin-bottom:18px;background:var(--hero-bg);color:var(--hero-ink);
  box-shadow:0 22px 44px -22px rgba(var(--brand-rgb),.75),0 0 0 1px rgba(255,255,255,.18) inset;transition:transform .2s ease}
.hero:active{transform:scale(.985)}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(30px);pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.hero::before{width:240px;height:240px;right:-70px;top:-110px;background:var(--hero-blob1)}
.hero::after{width:200px;height:200px;left:-60px;bottom:-110px;background:var(--hero-blob2);animation-delay:-7s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,18px) scale(1.12)}100%{transform:translate(-14px,8px) scale(.95)}}
.hero .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .eyebrow i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.hero .when{font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.035em;line-height:1;margin:8px 0 6px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14.5px;font-weight:600;opacity:.92}
.hero .meta span{display:inline-flex;align-items:center;gap:5px}
.hero .meta svg{width:15px;height:15px}
.hero .roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.hero .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px 5px 7px;font-size:13.5px;font-weight:700;
  background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero .pill svg{width:22px;height:22px;overflow:visible}
.cd{align-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;width:78px;height:86px;border-radius:22px;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
.cd b{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cd b.word{font-size:21px;letter-spacing:-.02em}
.cd small{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:4px}
.hero.quiet{display:block;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);cursor:default}
.hero.quiet::before,.hero.quiet::after{opacity:.35}
.hero.quiet .when{font-size:22px}
/* Entrada suave dos cartões (só na primeira abertura) */
.intro .card,.intro .hero,.intro .month{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.intro .list .card:nth-child(2){animation-delay:.06s}.intro .list .card:nth-child(3){animation-delay:.12s}.intro .list .card:nth-child(4){animation-delay:.18s}.intro .list .card:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
main>section{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:.0}}

/* Segmented */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Agenda */
.month{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px;padding:12px 16px;border-radius:18px;
  background:linear-gradient(120deg,rgba(var(--brand-rgb),.20),rgba(var(--brand-rgb),.05) 60%),color-mix(in srgb,var(--bg) 88%,transparent);border:1px solid rgba(var(--brand-rgb),.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.month small{display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.month h2{margin:0;font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.05;background:var(--brand-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.month h2 .yr{font-weight:500;letter-spacing:0;background:none;-webkit-text-fill-color:var(--muted);color:var(--muted);font-size:20px}
.month .mcount{flex:none;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--brand-grad);border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
.mright{display:flex;align-items:center;gap:8px;flex:none}
.mshare{width:38px;height:38px;border-radius:50%;border:1px solid color-mix(in srgb,var(--wa) 45%,transparent);background:color-mix(in srgb,var(--wa) 14%,transparent);color:var(--wa);display:grid;place-items:center}
.mshare svg{width:18px;height:18px}
.btn.wa{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;color:var(--wa);border-color:color-mix(in srgb,var(--wa) 40%,transparent);background:color-mix(in srgb,var(--wa) 10%,transparent)}
.btn.wa svg{width:18px;height:18px}
.wa-open{text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center}
.when-chip{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--brand-grad);border-radius:999px;padding:2px 8px}
.when-chip.soft{color:var(--accent);background:var(--accent-soft)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;width:100%;text-align:left;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);transition:transform .15s ease}
.card:active{transform:scale(.985)}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--blue-grad);color:#FFFFFF;border-radius:14px;padding:6px 0 7px;box-shadow:0 8px 20px -10px rgba(47,111,255,.75),0 0 0 1px rgba(255,255,255,.14) inset}
.date .wd{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#D6E4FF}
.date .d{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.date.today{background:var(--today-grad);color:var(--today-ink);box-shadow:0 8px 20px -10px rgba(var(--brand-rgb),.8)}
.date.today .wd{color:inherit;opacity:.85}
.card-main{min-width:0}
.card-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-title b{font-weight:700;font-size:15.5px}
.time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.you{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 8px}
.ri{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--tile);border:1px solid var(--line)}
.ri svg{width:28px;height:28px;overflow:visible}
.ri.sm{width:24px;height:24px;border-radius:7px}
.ri.sm svg{width:19px;height:19px}
.ri.lg{width:46px;height:46px;border-radius:14px}
.ri.lg svg{width:38px;height:38px}
.ri.gold{background:var(--tile-gold);border-color:rgba(var(--brand-rgb),.55);box-shadow:0 0 16px -3px rgba(var(--brand-rgb),.6)}
.lead{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:14px;background:linear-gradient(90deg,rgba(var(--brand-rgb),.16),rgba(var(--brand-rgb),.03));border:1px solid rgba(var(--brand-rgb),.22)}
.lead small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.lead b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.lead.none b{color:var(--muted);font-family:var(--f-body);font-size:14px;font-weight:500;font-style:italic}
.team{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.trow{display:grid;grid-template-columns:34px minmax(0,auto) 1fr;gap:9px;align-items:center;font-size:14px}
.trow .rn{color:var(--muted)}
.trow .nm{font-weight:600;text-align:right;overflow-wrap:anywhere}
.trow.is-me .nm{color:var(--gold)}
.lead.is-me b{color:var(--gold)}
.past .card{opacity:.7}

/* Empty / skeleton */
.empty{text-align:center;padding:36px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:22px}
.empty h3{font-family:var(--f-display);font-size:20px;margin:6px 0 4px}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:30ch}
.empty .staff{width:84px;height:40px;margin:0 auto;color:var(--accent)}
.empty .btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.skel{height:86px;border-radius:20px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* Notices */
.notice{display:grid;grid-template-columns:38px 1fr;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;position:relative}
.notice .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.notice.ajuste .ic{background:var(--gold-soft);color:var(--gold)}
.notice.cancelada .ic{background:var(--danger-soft);color:var(--danger)}
.notice b{display:block;font-size:14.5px}
.notice p{margin:2px 0 4px;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.notice small{font-size:11.5px;color:var(--muted)}
.notice .dot{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.forme{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-left:6px}

/* Members */
.member{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.member .info{flex:1;min-width:0}
.member b{display:block}
.member .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.member .tags{gap:4px 10px}
.member .tags>span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.member .next{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;flex:none}

/* Tab bar + FAB */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .in{max-width:448px;margin:0 auto;display:flex;justify-content:space-around}
.tab{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 18px;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab.on::after{content:"";position:absolute;bottom:-2px;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.badge{position:absolute;top:2px;right:10px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 224px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border:0;border-radius:18px;padding:14px 18px;background:var(--brand-grad);color:var(--accent-ink);font-weight:800;box-shadow:0 10px 30px -6px rgba(var(--brand-rgb),.55)}
.fab svg{width:20px;height:20px}

/* Buttons & forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:700}
.btn.primary{background:var(--brand-grad);color:var(--accent-ink);border-color:transparent;font-weight:800}
.btn.danger{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;padding:2px 4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 120px;gap:10px}
.timebox{display:flex;flex-direction:column;gap:10px}
#f-time{max-width:140px;font-family:var(--f-display);font-size:24px;font-weight:700;text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums}
#time-chips .chip{font-variant-numeric:tabular-nums;padding:9px 14px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--brand-grad);border-color:transparent;color:var(--accent-ink)}
.chip.other{border-style:dashed;color:var(--muted)}
.rgroup{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--surface)}
.rgroup-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700;font-size:14px}
.rgroup-head small{font-weight:600;color:var(--muted);font-size:11.5px}
.rgroup-head .link{margin-left:auto}
.rgroup:not(.all) .chip.other:not(.on){display:none}
.rgroup .none{font-size:12.5px;color:var(--muted)}
.rgroup.all .none{display:none}
.sec{font-family:var(--f-display);font-size:17px;margin:18px 0 10px}
.preview{font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:9px 12px;margin:0 0 12px}
.preview:empty{display:none}
.muted{color:var(--muted)}

/* Sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:var(--veil);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{flex:1;margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:-.015em;text-wrap:balance}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.sheet-actions{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;padding-top:10px;background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.sheet-actions .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

/* Scale detail */

.rolerow .rl{font-size:12px;color:var(--muted);font-weight:600}
.rolerow .names{font-weight:700;overflow-wrap:anywhere}
.rolerow .names .me{color:var(--gold)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.box h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.box ol{margin:0;padding-left:20px}
.box ol li{padding:2px 0}
.box p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.box-head h4{margin:0}
.word{margin:0 0 12px;padding:12px 14px;background:var(--accent-soft);border-radius:14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.word cite{display:block;margin-top:6px;font-style:normal;font-size:12px;font-weight:700;color:var(--accent)}
.songs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.songs li{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.songs li:first-child{border-top:0}
.songs .n{font-family:var(--f-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.songs b{font-weight:700;min-width:0;overflow-wrap:anywhere}
.key{font-family:var(--f-display);font-weight:800;font-size:13px;min-width:38px;text-align:center;padding:3px 8px;border-radius:8px;background:var(--gold-soft);color:var(--gold)}
.key.vazio{background:transparent;color:var(--muted);font-weight:500}
.yt{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12.5px;font-weight:700;color:var(--yt);background:color-mix(in srgb,var(--yt) 12%,transparent);border-radius:999px;padding:5px 10px}
.yt svg{width:14px;height:14px}
.yt.off{visibility:hidden}
.setempty{color:var(--muted);margin:0 0 10px}
.song{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;margin-bottom:8px}
.song-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.song-top .n{font-family:var(--f-display);font-weight:800;width:22px;text-align:center;color:var(--accent);flex:none}
.song-meta{display:grid;grid-template-columns:96px 1fr;gap:8px}
.song input{padding:9px 11px}
.notes-chip{font-size:11.5px;font-weight:700;color:var(--muted)}
.lead-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);color:var(--ink);border-radius:16px;padding:12px 14px;margin:-6px 0 18px;border:0;width:100%;text-align:left}
.lead-cta b{display:block;color:var(--gold)}
.lead-cta span span{font-size:13px;color:var(--muted)}
.confirm{background:var(--danger-soft);border-radius:16px;padding:14px;margin-top:12px}
.confirm p{margin:0 0 10px;color:var(--danger);font-weight:600}

.who{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:8px}
.who.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.who b{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-top:14px}
.toggle small{display:block;color:var(--muted)}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}

/* Toast */
.toast{position:fixed;z-index:60;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(448px,calc(100% - 32px));background:var(--surface-2);color:var(--ink);outline:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);animation:drop .3s cubic-bezier(.2,.9,.3,1);border:0;text-align:left}
.toast .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.toast b{display:block;font-size:14px}
.toast span{font-size:13px;opacity:.8}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.wm h1{font-size:23px}.wm small{letter-spacing:.16em}.me-btn>span:nth-child(2){display:none}.me-btn{padding:4px}}

  catch(e){

  if(!loaded.s||!loaded.m){el.innerHTML=`<div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;return}
  const t=todayIso(),mid=me();
  const sorted=[...state.scales].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let hero='';
  if(mid){
    const nx=sorted.find(s=>s.date>=t&&scaleMembers(s).includes(mid));
    const n=nx?daysUntil(nx.date):0;
    const cd=n===0?'<b class="word">Hoje</b><small>é o dia</small>':n===1?'<b class="word">Amanhã</b><small>prepare-se</small>':`<b>${n}</b><small>dias</small>`;
    hero=nx?`<button class="hero" data-action="open-scale" data-id="${nx.id}">
      <div>
        <div class="eyebrow"><i></i>Seu próximo culto</div>
        <div class="when">${fmtShort(nx.date)}</div>
        <div class="meta"><span>${esc(nx.service)}</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${esc(nx.time)}</span></div>
        <div class="roles">${myRoles(nx).map(r=>`<span class="pill"><svg viewBox="0 0 48 48">${ART[r.k]}</svg>${r.label}</span>`).join('')}</div>
      </div>
      <div class="cd" aria-label="Faltam ${n} dias">${cd}</div></button>
      ${leaderOf(nx).includes(mid)&&!setlistOf(nx.id)?.songs?.length?`<button class="lead-cta" data-action="edit-setlist" data-id="${nx.id}"><span><b>Você lidera este culto</b><span>Defina as músicas, os tons e os links para a equipe ensaiar.</span></span><span class="btn primary" style="padding:8px 12px">Montar</span></button>`:''}`
      :`<div class="hero quiet"><div class="eyebrow">Seu próximo culto</div><div class="when">Nenhuma escala por enquanto</div><div class="svc muted">Você será avisado quando for escalado.</div></div>`;
  }
  let list;
  if(filter==='proximas')list=sorted.filter(s=>s.date>=t);
  else if(filter==='minhas')list=sorted.filter(s=>s.date>=t&&mid&&scaleMembers(s).includes(mid));
  else list=sorted.filter(s=>s.date<t).reverse();
  const seg=`<div class="seg" role="tablist">${[['proximas','Próximas'],['minhas','Minhas'],['anteriores','Anteriores']].map(([k,l])=>`<button class="${filter===k?'on':''}" data-action="filter" data-f="${k}" role="tab" aria-selected="${filter===k}">${l}</button>`).join('')}</div>`;
  let body='';
  if(!state.members.length&&!state.scales.length){
    body=`<div class="empty">${STAFF}<h3>Monte sua equipe</h3><p>${isAdmin?'Comece cadastrando as pessoas do louvor e as funções de cada uma.':'O líder ainda não publicou nenhuma escala.'}</p>
      ${isAdmin?`<div class="btns"><button class="btn primary" data-action="new-member">Adicionar pessoa</button><button class="btn ghost" data-action="load-sample">Carregar exemplo para testar</button></div>`:''}</div>`;
  }else if(!list.length){
    const msg=filter==='minhas'?(mid?'Você não está em nenhuma escala futura.':'Escolha quem você é no topo para ver suas escalas.'):filter==='anteriores'?'Nenhum culto passado registrado.':'Nenhuma escala futura publicada.';
    body=`<div class="empty">${STAFF}<h3>Nada por aqui</h3><p>${msg}</p>${isAdmin&&filter==='proximas'?`<button class="btn primary" data-action="new-scale">Criar escala</button>`:''}</div>`;
  }else{
    const groups=[];list.forEach(s=>{const k=s.date.slice(0,7);let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,items:[]});g.items.push(s)});
    body=groups.map(g=>{const[y,m]=g.k.split('-').map(Number);
      return `<div class="month"><div><small>Escala de</small><h2>${MESL[m-1]} <span class="yr">${y}</span></h2></div><span class="mright"><span class="mcount">${g.items.length} ${g.items.length>1?'cultos':'culto'}</span>${filter!=='anteriores'?`<button class="mshare" data-action="share-month" data-k="${g.k}" aria-label="Enviar a escala de ${MESL[m-1]} no WhatsApp">${SEND}</button>`:''}</span></div><div class="list">${g.items.map(cardHTML).join('')}</div>`}).join('');
    if(filter==='anteriores')body=`<div class="past">${body}</div>`;
  }
  el.innerHTML=hero+seg+body;
}

function computeDates(form){
  const mode=form.dataset.mode;
  if(mode==='unica'){const v=brToIso($('#f-date').value);return v?[v]:[]}
  const days=[...form.querySelectorAll('#days .chip.on')].map(c=>+c.dataset.dow);
  if(mode==='semanal'){const v=brToIso($('#f-week').value);if(!v)return[];const st=addDays(parse(v),-parse(v).getDay());return days.sort().map(w=>iso(addDays(st,w)))}
  const ym=parseMonth($('#f-month').value);if(!ym)return[];const[y,m]=ym;const out=[];
  for(let d=new Date(y,m-1,1);d.getMonth()===m-1;d=addDays(d,1))if(days.includes(d.getDay()))out.push(iso(d));
  return out;
}
function updatePreview(){
  const f=$('#scale-form');if(!f)return;
  f.querySelectorAll('[data-show]').forEach(el=>el.hidden=!el.dataset.show.split(' ').includes(f.dataset.mode));
  const p=$('#preview');
  const ds=computeDates(f);
  if(f.dataset.id||f.dataset.mode==='unica'){
    const x=ds[0]&&parse(ds[0]);
    p.textContent=x?`${WDL[x.getDay()]}, ${x.getDate()} de ${MESL[x.getMonth()].toLowerCase()} de ${x.getFullYear()}`:'Digite a data assim: 12/10/2026';return}
  p.textContent=ds.length?`Serão criadas ${ds.length} ${ds.length>1?'escalas':'escala'}: ${ds.map(fmtShort).join(' · ')}`:'Escolha ao menos um dia de culto.';
}

function diffText(a,b){
  const out=[];
  if(a.date!==b.date)out.push(`Data: ${fmtShort(a.date)} → ${fmtShort(b.date)}`);
  if(a.time!==b.time)out.push(`Horário: ${a.time} → ${b.time}`);
  ROLES.forEach(r=>{const x=a.assign?.[r.k]||[],y=b.assign?.[r.k]||[];
    if(x.join()!==y.join())out.push(`${r.short}: ${x.map(nameOf).join(', ')||'—'} → ${y.map(nameOf).join(', ')||'—'}`)});
  if((a.notes||'')!==(b.notes||''))out.push('Observações atualizadas');
  return out.join(' · ');
}
async function saveScale(f){
  const id=f.dataset.id;
  const dates=computeDates(f);
  if(!dates.length){showToast('Faltou a data','Escolha a data ou os dias de culto.','x');return}
  const assign={};f.querySelectorAll('.rgroup').forEach(g=>assign[g.dataset.role]=[...g.querySelectorAll('.chip.on')].map(c=>c.dataset.id));
  const time=normTime($('#f-time').value);
  if(!time){showToast('Horário inválido','Digite assim: 19:00, 1930 ou só 19.','x');$('#f-time').focus();return}
  const service=$('#f-service').value.trim();
  const notes=$('#f-notes').value.trim();
  const now=Date.now(),team=[...new Set(Object.values(assign).flat())];
  const ok=await guarded(async()=>{
    if(id){
      const old=state.scales.find(x=>x.id===id);
      const s={...old,date:dates[0],time,service:service||defaultService(dates[0]),assign,notes,updatedAt:now};
      await store.putScale(s);
      await store.addNotice({kind:'ajuste',title:`Escala ajustada · ${fmtShort(s.date)}`,body:diffText(old,s)||'Detalhes atualizados',scaleIds:[id],memberIds:[...new Set([...scaleMembers(old),...team])],at:now});
    }else{
      const mode=f.dataset.mode;
      const made=dates.map(dt=>({id:uid(),date:dt,time,service:service||defaultService(dt),assign,notes,createdAt:now,updatedAt:now}));
      for(const s of made)await store.putScale(s);
      const d0=parse(dates[0]);
      const title=mode==='mensal'?`Escala de ${MESL[d0.getMonth()]} publicada`:mode==='semanal'?'Escala da semana publicada':`Nova escala · ${fmtShort(dates[0])}`;
      const body=made.length>1?`${made.length} cultos: ${dates.map(fmtShort).join(', ')}`:`${made[0].service} às ${time}`;
      await store.addNotice({kind:'nova',title,body,scaleIds:made.map(s=>s.id),memberIds:team,at:now});
    }
  });
  if(ok){closeSheet();showToast(id?'Ajuste salvo':'Escala publicada',team.length?`${team.length} ${team.length>1?'pessoas foram avisadas':'pessoa foi avisada'}.`:'Ainda sem equipe definida.','ok')}
}
async function deleteScale(id){
  const s=state.scales.find(x=>x.id===id);if(!s)return;
  const ok=await guarded(async()=>{
    await store.delScale(id);
    await store.addNotice({kind:'cancelada',title:`Escala cancelada · ${fmtShort(s.date)}`,body:`${s.service} às ${s.time} foi removido da agenda.`,scaleIds:[],memberIds:scaleMembers(s),at:Date.now()});
  });
  if(ok){closeSheet();showToast('Escala excluída','A equipe foi avisada.','ok')}
}

    const title=row.querySelector('.s-title').value.trim();if(!title)continue;
    const url=normUrl(row.querySelector('.s-url').value);
    if(url===null){showToast('Link inválido',`Confira o link de “${title}”.`,'x');return}
    songs.push({title,key:row.querySelector('.s-key').value.trim(),url});
  }
  if(!songs.length){showToast('Nenhuma música','Escreva o nome de pelo menos uma música.','x');return}
  const comment=$('#f-comment').value.trim(),now=Date.now(),by=me()||leaderOf(s)[0]||'';
  const first=!setlistOf(id)?.songs?.length;
  const ok=await guarded(async()=>{
    await store.putSetlist(id,{by,comment,songs,updatedAt:now});
    await store.addNotice({kind:'repertorio',title:`${first?'Repertório definido':'Repertório ajustado'} · ${fmtShort(s.date)}`,
      body:`${nameOf(by).split(' ')[0]}: ${songs.map(x=>x.key?`${x.title} (${x.key})`:x.title).join(', ')}`,scaleIds:[id],memberIds:scaleMembers(s),at:now});
  },true);
  if(ok){closeSheet();showToast('Repertório enviado','A equipe escalada foi avisada.','ok');openScale(id)}
}

/* ---------- Enviar no WhatsApp (para quem não tem conta) ---------- */
const WA_EMO={lider:'🎤',backing:'🎙️',bateria:'🥁',baixo:'🎸',guitarra:'🎸',violao:'🪕',teclado:'🎹'};
function scaleText(s){
  const d=parse(s.date),lines=[`📅 *${WD[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)} · ${s.time}* · ${s.service}`];
  ROLES.forEach(r=>{const ids=s.assign?.[r.k]||[];if(ids.length)lines.push(`${WA_EMO[r.k]} ${r.k==='lider'?'*Líder de louvor:* ':r.label+': '}${ids.map(nameOf).join(', ')}`)});
  const sl=setlistOf(s.id);
  if(sl?.songs?.length)lines.push(`🎶 Músicas: ${sl.songs.map(x=>x.key?`${x.title} (${x.key})`:x.title).join(', ')}`);
  if(s.notes)lines.push(`📝 ${s.notes}`);
  return lines.join('\n');
}
function openShare(title,list){
  const text=[`*Escala de Louvor: Conectados*`,`*${title}*`,'',list.map(scaleText).join('\n\n')].join('\n');
  openSheet(`${head('Enviar no WhatsApp')}
    <p class="muted" style="margin:-6px 0 12px">Mande para o grupo. Quem não tem conta no Claude vê a escala direto na conversa.</p>
    <textarea id="share-text" rows="12" readonly style="font-size:14px">${esc(text)}</textarea>
    <div class="sheet-actions"><button class="btn" data-action="copy-share">Copiar texto</button><a class="btn primary wa-open" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a></div>
    <p class="muted" style="font-size:13px;margin:10px 2px 0">Se o botão do WhatsApp não abrir, toque em “Copiar texto” e cole no grupo.</p>`,'Enviar no WhatsApp');
}
function refreshWho(){const w=$('#who-sheet');if(w)w.innerHTML=identityBody()}
async function approveClaim(uidv,memberId){
  const ok=await guarded(async()=>{
    for(const l of linkedTo(memberId))if(l.uid!==uidv)await db.doc('links/'+l.uid).delete();
    await db.doc('links/'+uidv).set({memberId,at:Date.now()});
    await db.doc('claims/'+uidv).delete();
  });
  if(ok)showToast('Verificado',`${nameOf(memberId)} agora está vinculado.`,'ok');
}
function claimsPanel(){
  if(demo||!isAdmin||!(state.claims||[]).length)return'';
  return `<div class="box claims"><h4>Pedidos de verificação</h4>${state.claims.map(c=>`<div class="claim">
    <span class="claim-txt"><b class="cname" data-uid="${esc(c.uid)}">Alguém</b> pediu para ser <b>${esc(nameOf(c.memberId))}</b><small>${ago(c.at||Date.now())}</small></span>
    <span class="claim-btns"><button class="btn danger" data-action="reject" data-id="${esc(c.uid)}">Recusar</button><button class="btn primary" data-action="approve" data-id="${esc(c.uid)}" data-m="${esc(c.memberId)}">Aprovar</button></span></div>`).join('')}
    <p class="muted" style="font-size:13px;margin:8px 0 0">O nome em destaque é o da conta do Claude de quem pediu. Confira antes de aprovar.</p></div>`;
}
async function fillClaimNames(){
  const els=[...document.querySelectorAll('.cname')];if(!els.length||!userNs)return;

function openMember(id){
  const m=id?member(id):null;
  openSheet(`${head(m?'Editar pessoa':'Nova pessoa')}
    <form id="member-form" data-id="${m?m.id:''}">
      <div class="field"><label for="f-name">Nome</label><input id="f-name" value="${esc(m?.name||'')}" placeholder="Ex.: Ana Beatriz" required autocomplete="off"></div>
      <div class="field"><span class="lbl">Funções que costuma assumir (opcional: sem marcar, aparece em todas)</span><div class="chips" id="roles">${ROLES.map(r=>`<button type="button" class="chip ${(m?.roles||[]).includes(r.k)?'on':''}" data-action="toggle" data-k="${r.k}">${r.label}</button>`).join('')}</div></div>
      ${m&&!demo?`<div class="toggle" style="margin-top:4px"><span><b>${isAdmMember(m)?'Administrador':'Verificação'}</b><small>${linkedTo(m.id).length?'✓ Vinculado a uma conta. Só você pode desfazer.':'Ainda não vinculado. A pessoa pede pelo botão “Quem é você?”.'}</small></span>${linkedTo(m.id).length?`<button type="button" class="btn" data-action="unlink" data-id="${m.id}" style="padding:8px 12px">Desvincular</button>`:''}</div>`:''}
      <div class="sheet-actions">${m?`<button type="button" class="btn danger" data-action="ask-del-member" data-id="${m.id}">Remover</button>`:'<button type="button" class="btn" data-action="close">Cancelar</button>'}<button type="submit" class="btn primary">Salvar</button></div>

async function saveMember(f){
  const name=$('#f-name').value.trim();if(!name){showToast('Faltou o nome','Digite o nome da pessoa.','x');return}
  const roles=[...f.querySelectorAll('#roles .chip.on')].map(c=>c.dataset.k);
  const m={...(member(f.dataset.id)||{}),id:f.dataset.id||uid(),name,roles};
  if(await guarded(()=>store.putMember(m))){closeSheet();showToast('Equipe atualizada',`${name} foi salvo.`,'ok')}
}

const whoRow=(m,action,extra='')=>`<button class="who" data-action="${action}" data-id="${m.id}">${avatar(m)}<b>${esc(m.name)}</b><span class="muted" style="font-size:12px">${extra||ROLES.filter(r=>(m.roles||[]).includes(r.k)).map(r=>r.short).join(' · ')}</span></button>`;
function identityBody(){
  const ms=[...state.members].sort(byName),mid=me();
  if(demo)return `<p class="muted" style="margin:-6px 0 14px">No app de verdade, cada pessoa escolhe o nome uma vez e o ADM aprova. Aqui no exemplo você pode trocar à vontade.</p>
    ${ms.map(m=>whoRow(m,'set-me')).join('')}`;
  if(!myUid)return `<div class="box"><p>Não consegui identificar sua conta. Entre na sua conta do Claude e abra o app de novo.</p></div>`;
  if(mid){const m=member(mid);return `<div class="who on" style="cursor:default">${avatar(m)}<b>${esc(m.name)}</b><span class="verified">✓ Verificado</span></div>
    <p class="muted" style="margin:4px 2px 0;font-size:14px">Seu nome está vinculado à sua conta. Só o ADM pode alterar.</p>`}
  if(myClaim&&member(myClaim)){const m=member(myClaim);return `<div class="box"><h4>Pedido enviado</h4><p>Você pediu para ser <b>${esc(m.name)}</b>. Assim que o ADM aprovar, suas escalas aparecem aqui.</p></div>
    <button class="btn block" data-action="cancel-claim">Cancelar pedido</button>`}
  const taken=new Set((state.links||[]).map(l=>l.memberId));
  const opts=ms.filter(m=>isAdmin?isAdmMember(m):!isAdmMember(m)&&!taken.has(m.id));
  return `<p class="muted" style="margin:-6px 0 14px">${isAdmin?'Escolha seu nome de administrador.':'Toque no seu nome. O ADM vai confirmar que é você e, depois disso, não dá mais para trocar.'}</p>
    <div id="who-list">${opts.map(m=>whoRow(m,isAdmin?'self-link':'ask-claim')).join('')||'<p class="muted">Nenhum nome disponível. Fale com o ADM.</p>'}</div><div id="claim-confirm"></div>`;
}
function openIdentity(){
  openSheet(`${head(me()&&!demo?'Você':'Quem é você?')}<div id="who-sheet">${identityBody()}</div>
    <div class="toggle" style="flex-direction:column;align-items:stretch"><span><b>Aparência</b><small>Escolha como o app fica no seu celular.</small></span>
      <div class="seg theme" style="margin:4px 0 0">${[['dark','Escuro'],['light','Claro'],['auto','Igual ao celular']].map(([k,l])=>`<button class="${theme===k?'on':''}" data-action="set-theme" data-t="${k}">${l}</button>`).join('')}</div></div>
    <div class="toggle"><span><b>Letra maior</b><small>Aumenta textos e botões para facilitar a leitura.</small></span><button class="sw ${document.documentElement.classList.contains('big')?'on':''}" data-action="bigtext" aria-pressed="${document.documentElement.classList.contains('big')}" aria-label="Letra maior"></button></div>
    <div class="toggle"><span><b>Alerta sonoro</b><small>Toca um som e vibra quando chega aviso novo com o app aberto.</small></span><button class="sw ${soundOn?'on':''}" data-action="sound" aria-pressed="${soundOn}" aria-label="Alerta sonoro"></button></div>`,'Quem é você');
}

function confirmBox(text,action,id){
  $('#confirm-slot').innerHTML=`<div class="confirm"><p>${text}</p><div style="display:flex;gap:8px"><button type="button" class="btn" data-action="cancel-confirm" style="flex:1">Manter</button><button type="button" class="btn danger" data-action="${action}" data-id="${id}" style="flex:1">Confirmar exclusão</button></div></div>`;

}

/* ---------- Alerts ---------- */
let audioCtx=null;
document.addEventListener('pointerdown',()=>{try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}},{passive:true});
function chime(){
  if(!soundOn||!audioCtx)return;
  try{const t=audioCtx.currentTime;[[659.25,0],[987.77,.14]].forEach(([f,o])=>{const g=audioCtx.createGain(),osc=audioCtx.createOscillator();osc.type='sine';osc.frequency.value=f;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.18,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.6);osc.connect(g).connect(audioCtx.destination);osc.start(t+o);osc.stop(t+o+.65)})}catch(e){}
}
let toastTimer;
function showToast(title,body,kind='bell',action=''){
  const ic=kind==='ok'?'<path d="M5 12.5l4.5 4.5L19 7.5"/>':kind==='x'?'<path d="M12 7v6M12 17h.01"/>':'<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/>';
  $('#toast-root').innerHTML=`<button class="toast" ${action?`data-action="${action}"`:''} role="status"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></span><span><b>${esc(title)}</b><span>${esc(body)}</span></span></button>`;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',kind==='bell'?7000:3200);
}
function onIncoming(n){
  if(!relevant(n))return;
  showToast(n.title,n.body,'bell','go-avisos');chime();
  try{soundOn&&navigator.vibrate&&navigator.vibrate([90,60,90])}catch(e){}
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action,id=b.dataset.id;
  switch(a){
    case 'tab':
      if(view==='avisos'&&b.dataset.tab!=='avisos'){renderSeenAt=seenAt}
      view=b.dataset.tab;
      if(view==='avisos'){renderSeenAt=seenAt;seenAt=Date.now();LS.set('louvor.seen',seenAt)}
      render();window.scrollTo({top:0});break;
    case 'go-avisos':$('#toast-root').innerHTML='';renderSeenAt=seenAt;seenAt=Date.now();LS.set('louvor.seen',seenAt);view='avisos';closeSheet();render();break;
    case 'filter':filter=b.dataset.f;if(filter==='minhas'&&!me()){openIdentity();filter='proximas'}renderEscalas();break;
    case 'avisos-filter':avisosFilter=b.dataset.f;renderAvisos();break;
    case 'fab':view==='equipe'?openMember():openEditor();break;
    case 'new-scale':openEditor();break;
    case 'new-member':openMember();break;
    case 'edit-member':openMember(id);break;
    case 'open-scale':openScale(id);break;
    case 'edit-scale':openEditor(id);break;
    case 'open-notice':{const n=state.notices.find(x=>x.id===id);const sid=n?.scaleIds?.find(x=>state.scales.some(s=>s.id===x));if(sid&&n.scaleIds.length===1)openScale(sid);else if(n?.scaleIds?.length>1){view='escalas';filter='proximas';render()}break}
    case 'identity':openIdentity();break;
    case 'set-me':meId=id||null;LS.set('louvor.me',meId);if(!meId&&demo)meId='__none__';closeSheet();render();break;
    case 'ask-claim':{const m=member(id);$('#claim-confirm').innerHTML=`<div class="confirm" style="background:var(--accent-soft)"><p style="color:var(--ink)">Você é <b>${esc(m.name)}</b>? Depois que o ADM aprovar, não dá para trocar.</p><div style="display:flex;gap:8px"><button class="btn" data-action="cancel-confirm-claim" style="flex:1">Não</button><button class="btn primary" data-action="send-claim" data-id="${id}" style="flex:1">Sim, sou eu</button></div></div>`;$('#claim-confirm').scrollIntoView({block:'end',behavior:'smooth'});break}
    case 'cancel-confirm-claim':$('#claim-confirm').innerHTML='';break;
    case 'send-claim':db.doc('claims/'+myUid).set({memberId:id,at:Date.now()}).then(()=>{myClaim=id;refreshWho();showToast('Pedido enviado','Aguarde o ADM confirmar.','ok')}).catch(()=>showToast('Não foi possível enviar','Peça ao ADM para liberar seu acesso como Contribuidor.','x'));break;
    case 'cancel-claim':db.doc('claims/'+myUid).delete().then(()=>{myClaim=null;refreshWho()}).catch(()=>{});break;
    case 'self-link':guarded(()=>db.doc('links/'+myUid).set({memberId:id,at:Date.now()})).then(ok=>{if(ok){closeSheet();showToast('Pronto',`Você está como ${nameOf(id)}.`,'ok')}});break;
    case 'approve':approveClaim(id,b.dataset.m);break;
    case 'reject':guarded(()=>db.doc('claims/'+id).delete()).then(ok=>ok&&showToast('Pedido recusado','A pessoa pode pedir de novo.','ok'));break;
    case 'unlink':guarded(async()=>{for(const l of linkedTo(id))await db.doc('links/'+l.uid).delete()}).then(ok=>{if(ok){closeSheet();showToast('Vínculo removido',`${nameOf(id)} pode pedir a verificação de novo.`,'ok')}});break;
    case 'sound':soundOn=!soundOn;LS.set('louvor.sound',soundOn);b.classList.toggle('on',soundOn);b.setAttribute('aria-pressed',soundOn);if(soundOn)chime();break;
    case 'close':closeSheet();break;
    case 'backdrop':if(e.target===b)closeSheet();break;
    case 'mode':{const f=$('#scale-form');f.dataset.mode=b.dataset.mode;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));updatePreview();break}
    case 'day':b.classList.toggle('on');updatePreview();break;
    case 'toggle':b.classList.toggle('on');break;
    case 'role-all':{const g=b.closest('.rgroup');g.classList.toggle('all');b.textContent=g.classList.contains('all')?'Só da função':'Ver todos';break}
    case 'assign':{const g=b.closest('.rgroup');const on=!b.classList.contains('on');if(g.dataset.multi!=='true')g.querySelectorAll('.chip.on').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-pressed','false')});b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);break}
    case 'ask-del-scale':confirmBox('Excluir esta escala? Quem estava escalado recebe um aviso de cancelamento.','del-scale',id);break;
    case 'ask-del-member':confirmBox('Remover esta pessoa da equipe? Ela continua aparecendo como “Removido” nas escalas antigas.','del-member',id);break;
    case 'cancel-confirm':$('#confirm-slot').innerHTML='';break;
    case 'del-scale':deleteScale(id);break;
    case 'del-member':guarded(()=>store.delMember(id)).then(ok=>{if(ok){closeSheet();showToast('Pessoa removida','A equipe foi atualizada.','ok')}});break;
    case 'load-sample':loadSample();break;
    case 'edit-setlist':openSetlist(id);break;
    case 'theme':applyTheme(isLight()?'dark':'light');showToast(isLight()?'Tema claro':'Tema escuro','Dá para mudar quando quiser.','ok');break;
    case 'set-theme':applyTheme(b.dataset.t);break;
    case 'share-month':{const k=b.dataset.k,[y,m]=k.split('-').map(Number);const list=state.scales.filter(s=>s.date.startsWith(k)&&s.date>=todayIso()).sort((a,c)=>(a.date+a.time).localeCompare(c.date+c.time));openShare(`${MESL[m-1]} ${y}`,list);break}
    case 'share-one':{const s=state.scales.find(x=>x.id===id);if(s)openShare(`${s.service} · ${fmtShort(s.date)}`,[s]);break}
    case 'copy-share':{const t=$('#share-text');const done=()=>showToast('Texto copiado','Agora é só colar no grupo do WhatsApp.','ok');
      try{navigator.clipboard.writeText(t.value).then(done,()=>{t.focus();t.select();showToast('Selecionei o texto','Toque e segure para copiar.','x')})}catch(err){t.focus();t.select()}break}
    case 'pick':{const id=b.parentElement.dataset.for;$('#'+id).value=b.dataset.v;syncPick(id);updatePreview();break}
    case 'time':$('#f-time').value=b.dataset.t;syncTimeChips(b.dataset.t);break;
    case 'bigtext':{const on=document.documentElement.classList.toggle('big');LS.set('louvor.big',on);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);break}
    case 'add-song':{const box=$('#songs');box.insertAdjacentHTML('beforeend',songRow({},box.children.length));box.lastElementChild.querySelector('.s-title').focus();break}
    case 'del-song':b.closest('.song').remove();renumberSongs();break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='scale-form')saveScale(e.target);
  if(e.target.id==='member-form')saveMember(e.target);
  if(e.target.id==='setlist-form')saveSetlist(e.target);
});
document.addEventListener('input',e=>{
  if(['f-week','f-month','f-date'].includes(e.target.id)){maskInput(e.target);syncPick(e.target.id);updatePreview()}
  if(e.target.id==='f-time'){
    const d=e.target.value.replace(/\D/g,'').slice(0,4);

function syncTimeChips(v){document.querySelectorAll('#time-chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.t===v))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
/* Virada do dia: se o app ficar aberto, o culto que passou vai sozinho para "Anteriores" */
let lastDay=todayIso();
function dayCheck(){if(todayIso()!==lastDay){lastDay=todayIso();render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayCheck()});
setInterval(dayCheck,60000);

async function loadSample(){
  const s=sampleData();
  const ok=await guarded(async()=>{for(const m of s.members)await store.putMember(m);for(const x of s.scales)await store.putScale(x);for(const[k,v]of Object.entries(s.setlists))await store.putSetlist(k,v)});

/* ---------- Boot ---------- */
if(LS.get('louvor.big',false))document.documentElement.classList.add('big');
applyTheme(theme);
document.body.classList.add('intro');setTimeout(()=>document.body.classList.remove('intro'),1600);
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>applyTheme(theme))}catch(e){}
state=sampleData();
render();
(async()=>{
  if(!window.claude||typeof window.claude.use!=='function')return;
  const[dbNs,uNs]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!dbNs)return;
  userNs=uNs;
  db=dbNs;demo=false;state={members:[],scales:[],notices:[],setlists:{},links:[],claims:[]};loaded={m:false,s:false};
  if(userNs){const[e,o,i]=await Promise.all([userNs.canEdit(),userNs.isOwner(),userNs.id()]);isAdmin=!!(e||o);myUid=i}
  render();
  const onErr=()=>showToast('Conexão interrompida','Recarregue o app para voltar a receber atualizações.','x');
  db.collection('links').onSnapshot(s=>{
    state.links=s.docs.map(d=>({uid:d.id,...d.data()}));
    const mine=myUid&&state.links.find(l=>l.uid===myUid);myLink=mine?mine.memberId:null;
    render();refreshWho();
  },onErr);
  if(myUid&&!isAdmin)db.doc('claims/'+myUid).onSnapshot(d=>{myClaim=d.exists?d.data().memberId:null;refreshWho()},()=>{});
  if(isAdmin){
    let first=true;
    db.collection('claims').onSnapshot(s=>{
      state.claims=s.docs.map(d=>({uid:d.id,...d.data()}));
      const added=s.docChanges().filter(c=>c.type==='added').length;
      if(!first&&added)showToast('Novo pedido de verificação','Abra a aba Equipe para aprovar.','bell');
      first=false;render();
    },onErr);
  }
  db.collection('members').onSnapshot(s=>{state.members=s.docs.map(d=>({id:d.id,...d.data()}));loaded.m=true;render()},onErr);
  db.collection('scales').onSnapshot(s=>{state.scales=s.docs.map(d=>({id:d.id,...d.data()}));loaded.s=true;render()},onErr);
  db.collection('setlists').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());state.setlists=m;render()},onErr);
  db.collection('notices').orderBy('at','desc').limit(60).onSnapshot(s=>{
    const fresh=s.docChanges().filter(c=>c.type==='added'&&!myNotices.has(c.doc.id)&&(c.doc.data().at||0)>bootAt).map(c=>c.doc.data());
    state.notices=s.docs.map(d=>({id:d.id,...d.data()}));
    if(view==='avisos'){seenAt=Date.now();LS.set('louvor.seen',seenAt)}
    render();
    if(fresh.length)onIncoming(fresh[0]);
  },onErr);
})();
